<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; font-family: -apple-system, "PingFang SC", sans-serif; padding: 14px; margin: 0; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { font-size: 12px; color: #888; display: block; margin-bottom: 4px; }
  input { width: 100%; padding: 7px 9px; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; box-sizing: border-box; }
  button { width: 100%; margin-top: 12px; padding: 9px; border: none; border-radius: 8px; background: #07c160; color: #fff; font-size: 14px; cursor: pointer; }
  button:disabled { background: #b8e6cd; }
  #status { font-size: 12px; margin-top: 10px; min-height: 16px; color: #666; }
  #status.err { color: #d33; }
  a { color: #07c160; font-size: 12px; }
</style>
</head>
<body>
  <h1>🧰 FableUnion 工具箱</h1>
  <label>后端地址</label>
  <input id="server" value="http://localhost:8300">
  <button id="save">保存当前文章到工具箱</button>
  <div id="status"></div>
  <div style="margin-top:8px"><a id="open" href="#" target="_blank">打开工具箱 →</a></div>
  <script src="popup.js"></script>
</body>
</html>
