<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
</style>
</helmet>
<div style="min-height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:44px;background:linear-gradient(150deg,#7C6CE0 0%,#B98BE0 45%,#F0A98C 100%);font-family:-apple-system,'Noto Sans SC',system-ui,sans-serif">

  <div ref="{{ setScaler }}" style="width:1280px;height:862px;flex:none;transform-origin:top center">
    <x-import component-from-global-scope="MacWindow" from="./macos-window.jsx" width="{{ 1280 }}" height="{{ 862 }}" title="小灵造造" hint-size="1280px,862px">
      <div style="width:100%;height:100%;background:#F4E4CE">
        <dc-import name="儿童AI创作助手" embed="{{ true }}" style="width:100%;height:100%" hint-size="100%,100%"></dc-import>
      </div>
    </x-import>
  </div>

  <div style="display:flex;align-items:center;gap:10px;color:rgba(255,255,255,0.92);font-size:14px;font-weight:600;letter-spacing:.2px">
    <div style="width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center;font-family:'ZCOOL KuaiLe';font-size:13px">灵</div>
    小灵造造 · macOS 桌面版
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  setScaler(el) {
    this.el = el;
    if (!el) { if (this._ro) { this._ro.disconnect(); this._ro = null; } return; }
    if (!this._ro && window.ResizeObserver) {
      this._ro = new ResizeObserver(() => this.fit());
      // observe the viewport-sized parent so we react to width changes
      this._ro.observe(document.documentElement);
    }
    this._onResize = () => this.fit();
    window.addEventListener('resize', this._onResize);
    this.fit();
  }
  fit() {
    if (!this.el) return;
    const avail = document.documentElement.clientWidth - 72; // account for 44px padding + margin
    const s = Math.min(1, avail / 1280);
    this.el.style.transform = 'scale(' + (s > 0 ? s : 1) + ')';
    // collapse the height the scaled window frees up
    this.el.style.marginBottom = (862 * (s - 1)) + 'px';
  }
  componentWillUnmount() {
    if (this._ro) this._ro.disconnect();
    if (this._onResize) window.removeEventListener('resize', this._onResize);
  }
  renderVals() {
    return { setScaler: (el) => this.setScaler(el) };
  }
}
</script>
</body>
</html>
